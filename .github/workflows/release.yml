name: release
# Publish to PyPI on a version tag (v*). Uses PyPI Trusted Publishing (OIDC) — no API token stored.
# One-time setup on PyPI: add a Trusted Publisher for project `llm-spendguard` →
#   owner: llmspendguard · repo: llm-spendguard · workflow: release.yml · environment: pypi
# Then: bump src/spendguard/_version.py, update CHANGELOG.md, tag `vX.Y.Z`, push the tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:                          # GATE — a version tag must NOT publish an unverified build (forensic tool: no red build ships)
    runs-on: ubuntu-latest
    env:
      # The offline suite (test_runner) strips keys + points a DEAD PROXY at any real call — so tiktoken cannot
      # DOWNLOAD its o200k vocab on first use. Pin a cache dir the warm step below populates (with network) and the
      # test subprocess inherits (test_runner copies os.environ), so the real-BPE token tests run offline, not a
      # crude chars/token fallback that would 1-token-diverge the two estimators (measured: 257 vs 256).
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.tiktoken-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: 'pip'                     # reuse the pip wheel cache across runs (CI uses uv's cache; this is the pip-path parity)
          cache-dependency-path: pyproject.toml
      - name: Install (same extras as CI)
        # pydantic>=2 pinned (also on the extras): keep the release gate's resolve deterministic — a loose resolve can
        # pull pydantic 1.x and break `import anthropic` (its httpx2.Timeout is a pydantic dataclass).
        run: python -m pip install -e ".[openai,anthropic,dev]" "pydantic>=2"
      - name: Version SSOT — the tag MUST equal src/spendguard/_version.py (no file↔tag drift can publish)
        # The published wheel's version comes from pyproject's dynamic attr = spendguard._version.__version__ (the
        # SSOT read live from source). If the tag and that literal disagree, PyPI would get the file's version while
        # git says another — so fail fast here, before any expensive step, rather than publish a mismatch.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SOURCE_VERSION="$(python -c 'import spendguard._version as v; print(v.__version__)')"
          if [ "$TAG_VERSION" != "$SOURCE_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME (=$TAG_VERSION) != src/spendguard/_version.py ($SOURCE_VERSION) — bump the file to match the tag"
            exit 1
          fi
          echo "version SSOT ok: tag=$TAG_VERSION == source=$SOURCE_VERSION"
      - name: Provision the declared build backend for offline consumers
        run: |
          # The install-hook regression (tests/test_install_hook_end_to_end.py) creates a consumer venv with
          # --system-site-packages, so its `import setuptools` resolves against THIS job's BASE interpreter — not the
          # editable install above, whose build backend lives in a build-isolated temp env that does not persist.
          # Python 3.12's bare base ships no setuptools, so provision every declared build requirement here while the
          # network is live, enabling the genuinely offline --no-build-isolation editable install the test exercises.
          # Mirrors ci.yml's identical step so the release gate and the sharded PR gate run the same path;
          # pyproject.toml's build-system.requires stays the single source of truth.
          mapfile -t declared_build_requirements < <(python -c \
            "import pathlib, tomllib; print(*tomllib.loads(pathlib.Path('pyproject.toml').read_text())['build-system']['requires'], sep='\n')")
          python -m pip install "${declared_build_requirements[@]}"
      - name: Warm the tiktoken o200k cache (the offline suite can't download it)
        run: python -c "import tiktoken; tiktoken.get_encoding('o200k_base'); print('o200k cached')"
      - name: Lint
        run: ruff check src tests
      - name: Test suite (offline, no spend)
        # -n auto parallelises across cores (pytest-xdist, in the dev extra). The release gate previously ran this
        # SERIALLY (~12min) and re-proved exactly what ci.yml already runs sharded+parallel on the same commit.
        run: pytest -n auto
      - name: Price-literal audit
        run: SPENDGUARD_AUDIT_DIR=src/spendguard spendguard audit --ci

  publish:
    needs: test                  # publish ONLY after the tagged commit passes lint + tests + audit
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # OIDC token for trusted publishing
      contents: write          # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check the dist
        run: |
          pip install twine
          twine check dist/*
      - name: Publish to PyPI (trusted publishing + PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1 — 3rd-party action pinned to SHA
        with:
          attestations: true       # Sigstore-backed PEP 740 provenance on PyPI (uses the OIDC id-token above)
      - name: SBOM (CycloneDX) — full dependency surface incl. [all] extras
        run: |
          python -m pip install ".[all]" cyclonedx-bom
          cyclonedx-py environment -o sbom.cdx.json
          python - <<'PY'
          import json; d=json.load(open("sbom.cdx.json"))
          print("SBOM components:", len(d.get("components", [])))
          PY
      - name: Sign artifacts (Sigstore — keyless, GitHub OIDC identity)
        run: |
          python -m pip install sigstore
          python -m sigstore sign dist/*.tar.gz dist/*.whl   # → dist/*.sigstore.json transparency-log bundles
      - name: GitHub Release from CHANGELOG (+ SBOM + signatures)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # extract the matching "## [X.Y.Z]" section from the changelog as the release notes
          awk -v v="$VER" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $GITHUB_REF_NAME" > notes.md
          {
            echo ""
            echo "---"
            echo "**Supply chain:** PyPI upload carries PEP 740 attestations (Sigstore). Release assets include a"
            echo "CycloneDX SBOM (\`sbom.cdx.json\`) and Sigstore bundles (\`*.sigstore.json\`) — verify with:"
            echo '```'
            echo "python -m sigstore verify identity dist/llm_spendguard-$VER*.whl \\"
            echo "  --cert-identity https://github.com/llmspendguard/llm-spendguard/.github/workflows/release.yml@refs/tags/$GITHUB_REF_NAME \\"
            echo "  --cert-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md \
            dist/*.tar.gz dist/*.whl dist/*.sigstore.json sbom.cdx.json
