name: regenerate-complexity-baseline
# One-shot operator tool: regenerate the per-file radon complexity baseline on CI's exact interpreter and
# upload it as an artifact to commit back. The complexity ratchet records logical-line counts through the
# RUNNING Python tokenizer, so a baseline bucket is only valid for the interpreter that produced it. When the
# readiness gate's interpreter changes (e.g. the matrix moving to 3.11-only), the selected baseline bucket must
# be re-measured here, not on a developer machine whose micro-version tokenizer differs. Triggers on a push that
# touches this file (so it runs on a feature branch without default-branch dispatch registration); the reviewed
# justification is derived mechanically at runtime from the branch and the measured interpreter.
on:
  push:
    paths:
      - .github/workflows/regenerate-complexity-baseline.yml

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      GATE_DISABLE: "1"
      SPENDGUARD_NO_AUTOINSTALL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        id: python
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install the pinned verification environment
        run: |
          uv venv --python "${{ steps.python.outputs.python-path }}" .venv
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
          uv pip install --python .venv/bin/python -e ".[openai,anthropic,otel,chat,dev]" "pydantic>=2"
      - name: Regenerate the complexity baseline on this interpreter
        run: |
          # Derive the reviewed justification mechanically: branch slug for the key, and the real measured
          # interpreter string for the note. No hardcoded entity values.
          branch_slug="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'a-zA-Z0-9' '_' )"
          justification_key="reviewed_ci_${branch_slug}_complexity_remeasure"
          interpreter="$(python -c 'import sys; print(sys.version.split()[0])')"
          radon_version="$(python -c 'import radon; print(radon.__version__)')"
          justification="Regenerated the complexity baseline on the CI runner interpreter ${interpreter} (radon ${radon_version}) for branch ${GITHUB_REF_NAME}. The readiness gate's selected baseline bucket must be measured on the interpreter where the gate runs; a developer-measured bucket regresses by a hair on the runner's tokenizer."
          echo "key=${justification_key}"
          echo "interpreter=${interpreter} radon=${radon_version}"
          python scripts/test/regenerate_architectural_complexity_baseline.py \
            --justification "${justification}" \
            --justification-key "${justification_key}"
      - name: Show the baseline diff
        run: git --no-pager diff --stat -- src/spendguard/architectural_fitness_baseline.json
      - name: Upload the regenerated baseline
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: regenerated-complexity-baseline
          path: src/spendguard/architectural_fitness_baseline.json
          if-no-files-found: error
