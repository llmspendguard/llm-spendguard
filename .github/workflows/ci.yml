name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CI_TEST_VENV: .venv
  CI_TEST_CACHE_REVISION: gate-env-v1
  CI_TEST_EXTRAS: ".[openai,anthropic,otel,chat,dev]"
  CI_PYDANTIC_FLOOR: "pydantic>=2"
  CI_GATE_TIMINGS: .test_durations.json
  CI_GATE_REPORT_PREFIX: gate-report
  CI_GATE_ARTIFACT_PREFIX: coverage
  CI_GATE_ARTIFACT_ROOT: coverage-artifacts
  CI_GATE_COVERAGE_INVENTORY: gate-coverage-manifest.json
  CI_READINESS_ARTIFACT_PREFIX: readiness-environment
  CI_READINESS_EVIDENCE_ROOT: readiness-evidence
  CI_READINESS_ENVIRONMENT_REPORT: readiness-environments.json
  CI_READINESS_INSTALL_REPORT: readiness-installation.json
  CI_OFFLINE_PROXY: http://127.0.0.1:9
  # Warm with network before the runner's dead proxy is enabled; subprocesses inherit this cache.
  TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.tiktoken-cache

jobs:
  gate-plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - id: plan
        run: echo "shards=$(python tests/_gate_shard_plan.py matrix --timings "$CI_GATE_TIMINGS")" >> "$GITHUB_OUTPUT"
  test:
    needs: gate-plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        shard-index: ${{ fromJSON(needs.gate-plan.outputs.shards) }}
    env:
      SPENDGUARD_GATE_SHARD_INDEX: ${{ matrix.shard-index }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        id: python
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Cache resolved environment and tiktoken vocabulary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.CI_TEST_VENV }}
            ${{ env.TIKTOKEN_CACHE_DIR }}
          key: ${{ env.CI_TEST_CACHE_REVISION }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('pyproject.toml', '.github/workflows/ci.yml') }}
      - name: Install (with provider SDKs + test deps)
        run: |
          if [ ! -x "${CI_TEST_VENV}/bin/python" ]; then
            uv venv --python "${{ steps.python.outputs.python-path }}" "$CI_TEST_VENV"
          fi
          echo "${PWD}/${CI_TEST_VENV}/bin" >> "$GITHUB_PATH"
          # pydantic>=2 is declared on the SDK extras too (see pyproject); pinned here as well so CI resolution stays
          # deterministic — a backtracking resolve once pulled pydantic 1.x and broke `import anthropic` (httpx2.Timeout).
          # Refresh the editable install even on a cache hit, so checkout metadata always matches the current tree.
          uv pip install --python "${CI_TEST_VENV}/bin/python" -e "$CI_TEST_EXTRAS" "$CI_PYDANTIC_FLOOR"
      - name: Provision the declared build backend for offline consumers
        run: |
          # The install-hook regression creates a consumer with --system-site-packages. A venv created by this
          # intermediate test venv inherits setup-python's BASE site-packages, not the test venv's packages.
          # Provision every declared build requirement there while the network is live so Python 3.12's bare base
          # can perform a genuinely offline --no-build-isolation editable install. Keep the requirements' floors in
          # pyproject.toml as the single source of truth.
          mapfile -t declared_build_requirements < <(python -c \
            "import pathlib, tomllib; print(*tomllib.loads(pathlib.Path('pyproject.toml').read_text())['build-system']['requires'], sep='\n')")
          uv pip install --python "${{ steps.python.outputs.python-path }}" "${declared_build_requirements[@]}"
      - name: Warm the tiktoken o200k cache (the offline suite can't download it)
        run: python -c "import tiktoken; tiktoken.get_encoding('o200k_base'); print('o200k cached')"
      - name: Lint (ruff — pyflakes + bugbear correctness rules)
        run: ruff check src tests
      - name: Pricing self-check
        run: spendguard pricing
      - name: Price freshness (warns if stale; non-fatal here)
        run: spendguard check-prices || true
      - name: Test suite + coverage (offline — ENFORCED by the runner's dead proxy + stripped keys)
        run: |
          # -n auto: every test file is an isolated subprocess with its own temp home, so they are
          # embarrassingly parallel (one live-billing hog once made the serial suite read as 24 min).
          SPENDGUARD_GATE_TIMINGS="$CI_GATE_TIMINGS" SPENDGUARD_COVERAGE=1 pytest -n auto --junitxml="${CI_GATE_REPORT_PREFIX}-${{ matrix.shard-index }}.xml"
      - name: Snapshot every coverage input before transport
        run: python tests/_gate_shard_plan.py snapshot-coverage --directory "$GITHUB_WORKSPACE" --inventory-name "$CI_GATE_COVERAGE_INVENTORY"
      - name: Upload complete shard coverage and case report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.CI_GATE_ARTIFACT_PREFIX }}-${{ matrix.python-version }}-${{ matrix.shard-index }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .coverage.*
            ${{ env.CI_GATE_COVERAGE_INVENTORY }}
            ${{ env.CI_GATE_REPORT_PREFIX }}-${{ matrix.shard-index }}.xml
      - name: Price-literal audit (FAILS the build on a mispriced literal)
        run: SPENDGUARD_AUDIT_DIR=src/spendguard spendguard audit --ci
  coverage:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        id: python
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Cache resolved environment and tiktoken vocabulary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.CI_TEST_VENV }}
            ${{ env.TIKTOKEN_CACHE_DIR }}
          key: ${{ env.CI_TEST_CACHE_REVISION }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('pyproject.toml', '.github/workflows/ci.yml') }}
      - name: Reset the verification environment before its clean installation
        run: uv venv --clear --python "${{ steps.python.outputs.python-path }}" "$CI_TEST_VENV"
      - name: Install the same coverage environment freshly for independent evidence
        run: |
          if [ ! -x "${CI_TEST_VENV}/bin/python" ]; then
            uv venv --python "${{ steps.python.outputs.python-path }}" "$CI_TEST_VENV"
          fi
          echo "${PWD}/${CI_TEST_VENV}/bin" >> "$GITHUB_PATH"
          uv pip install --python "${CI_TEST_VENV}/bin/python" -e "$CI_TEST_EXTRAS" "$CI_PYDANTIC_FLOOR"
      - name: Record successful clean installation and enforce spend governance
        run: |
          "${CI_TEST_VENV}/bin/python" -c 'import json, os, pathlib, sys; pathlib.Path(os.environ["CI_READINESS_INSTALL_REPORT"]).write_text(json.dumps({"interpreter": sys.executable, "clean": True, "installation_exit_code": 0}))'
          "${CI_TEST_VENV}/bin/spendguard" install-hook --venv "$CI_TEST_VENV"
      - name: Verify the same interpreter enforces spend governance
        run: spendguard doctor
      - name: Download every shard for this Python version
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ${{ env.CI_GATE_ARTIFACT_PREFIX }}-${{ matrix.python-version }}-*
          path: ${{ env.CI_GATE_ARTIFACT_ROOT }}
          merge-multiple: false
      - name: Verify complete evidence, combine all shards, enforce both floors
        run: |
          python tests/_gate_shard_plan.py verify-reports --timings "$CI_GATE_TIMINGS" --reports "$CI_GATE_ARTIFACT_ROOT" --artifact-prefix "${CI_GATE_ARTIFACT_PREFIX}-${{ matrix.python-version }}-" --inventory-name "$CI_GATE_COVERAGE_INVENTORY"
          coverage combine --keep "$CI_GATE_ARTIFACT_ROOT"/*
          # Two floors: a whole-package regression floor, and a HIGH bar on the money-critical core (the gate,
          # ledger, reconcile, pricing, attribution). The package number is dragged by I/O-adapter modules
          # (chat→claude.ai, saas push, transcript parsers, paid-call tools) that are integration- not unit-tested
          # by design; the core is where correctness must be proven. Measured locally: package ~70%, core ~81%.
          coverage report --fail-under=40
          coverage report --fail-under=78 --include="*/gate.py,*/guard.py,*/budget.py,*/reconcile.py,*/ledger_sync.py,*/pricing.py,*/attribution.py,*/adapters.py,*/tag.py,*/backfill.py,*/deid.py,*/litellm_adapter.py,*/bedrock_adapter.py"
      - name: Record complete clean-environment readiness evidence (offline)
        run: |
          export HTTP_PROXY="$CI_OFFLINE_PROXY" HTTPS_PROXY="$CI_OFFLINE_PROXY" ALL_PROXY="$CI_OFFLINE_PROXY"
          export http_proxy="$CI_OFFLINE_PROXY" https_proxy="$CI_OFFLINE_PROXY" all_proxy="$CI_OFFLINE_PROXY"
          export NO_PROXY= no_proxy= PIP_NO_INDEX=1
          python scripts/test/readiness_environment_evidence.py record --clean-install-report "$CI_READINESS_INSTALL_REPORT" --output "$CI_READINESS_EVIDENCE_ROOT"
      - name: Upload complete readiness logs and hashes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.CI_READINESS_ARTIFACT_PREFIX }}-${{ matrix.python-version }}
          path: ${{ env.CI_READINESS_EVIDENCE_ROOT }}
          include-hidden-files: true
          if-no-files-found: error

  readiness:
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install the same gated verification environment
        run: |
          uv venv "$CI_TEST_VENV"
          echo "${PWD}/${CI_TEST_VENV}/bin" >> "$GITHUB_PATH"
          uv pip install --python "${CI_TEST_VENV}/bin/python" -e "$CI_TEST_EXTRAS" "$CI_PYDANTIC_FLOOR"
          "${CI_TEST_VENV}/bin/spendguard" install-hook --venv "$CI_TEST_VENV"
      - name: Download both Python environments and complete evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ${{ env.CI_READINESS_ARTIFACT_PREFIX }}-*
          path: ${{ env.CI_READINESS_EVIDENCE_ROOT }}
          merge-multiple: false
      - name: Verify artifact integrity and merge environment evidence
        run: python scripts/test/readiness_environment_evidence.py merge --input "$CI_READINESS_EVIDENCE_ROOT" --output "$CI_READINESS_ENVIRONMENT_REPORT"
      - name: Blocking offline capability and architectural readiness gates
        run: |
          export HTTP_PROXY="$CI_OFFLINE_PROXY" HTTPS_PROXY="$CI_OFFLINE_PROXY" ALL_PROXY="$CI_OFFLINE_PROXY"
          export http_proxy="$CI_OFFLINE_PROXY" https_proxy="$CI_OFFLINE_PROXY" all_proxy="$CI_OFFLINE_PROXY"
          export NO_PROXY= no_proxy= PIP_NO_INDEX=1
          spendguard selfcheck --environment-report "$CI_READINESS_ENVIRONMENT_REPORT"
