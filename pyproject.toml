[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-spendguard"
dynamic = ["version"]   # version SSOT is src/spendguard/_version.py (see [tool.setuptools.dynamic] below) — never a literal here
description = "A pre-spend GATE + learning advisor for LLM API cost: caps every call, prices from a verified table, and learns the cheapest config that keeps quality."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ash Damle" }]
keywords = ["llm", "openai", "anthropic", "cost", "budget", "finops", "tokens", "prompt-caching", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = ['tomli>=1.1.0 ; python_version < "3.11"', 'psutil']
# openai / anthropic / tiktoken are OPTIONAL extras ([openai]/[anthropic]/[all]). With no SDK present
#                     the PASSIVE auto-gate simply no-ops (there is nothing to patch), but spendguard.require() FAILS
#                     CLOSED (raises SpendGateRefused) — a require()-guarded script never spends ungated. A consumer that
#                     needs the gate to actually enforce must install a provider SDK: depend on llm-spendguard[openai]
#                     (or [anthropic] / [all]), not bare llm-spendguard.

[project.urls]
Homepage = "https://llmspendguard.com"
Documentation = "https://docs.llmspendguard.com/"
Repository = "https://github.com/llmspendguard/llm-spendguard"
Changelog = "https://github.com/llmspendguard/llm-spendguard/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# pydantic>=2 on the SDK extras: openai>=1 and anthropic are pydantic-2-based, but a loose/backtracking pip resolve can
# pull pydantic 1.x into the set — which breaks `import anthropic` (its httpx2.Timeout is a pydantic dataclass). spendguard
# imports no pydantic itself; this floor just stops the SDKs' own requirement from being silently downgraded.
openai = ["openai>=1.0", "tiktoken", "pydantic>=2"]
anthropic = ["anthropic>=0.40", "pydantic>=2"]
otel = ["opentelemetry-sdk"]
chat = ["cryptography>=3"]   # in-process AES for the claude.ai cookie decrypt (keeps the key out of argv)
deid = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]   # opt-in NER de-id; the regex floor needs no deps
all = ["openai>=1.0", "tiktoken", "anthropic>=0.40", "opentelemetry-sdk", "cryptography>=3", "pydantic>=2"]   # excl. deid (heavy spaCy)
dev = ["pytest>=7", "pytest-xdist>=3", "build", "twine", "ruff>=0.6", "coverage[toml]>=7", "hypothesis>=6",
       "httpx", "PyYAML>=6"]   # httpx mocks raw HTTP; PyYAML parses the fixed CI execution contract

[project.scripts]
spendguard = "spendguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The catalog is authored runtime price and capability data, required in installed wheels.
spendguard = ["model_catalog.json", "subscription_headroom_surfaces.json", "py.typed",
              "capability_registry_data.jsonl",
              "capability_mcp_contracts.json", "capability_cli_projection_data.json",
              "capability_cli_manual_schema_data.json", "capability_cli_grammar_data.json",
              "distribution_build_wheels/*.whl"]

[tool.setuptools.dynamic]
# The version comes from ONE place — the src literal — read at build time so wheel metadata matches the code.
version = { attr = "spendguard._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# only the runner is a pytest module; it subprocess-runs the script-style tests (some os.execv at import,
# which would hijack pytest if collected directly).
python_files = ["test_runner.py", "test_chaos_runner.py"]
markers = ["chaos: concurrent fault injection and mandatory mutation proof (zero spend)"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
# Correctness over style: pyflakes (unused/undefined/redefined names) + the real bugbear footguns (mutable
# defaults, loop-var-in-closure). Deliberately NOT enforcing import-grouping/line-length — the codebase uses a
# terse one-line-import style on purpose. This keeps the gate high-signal (catches real bugs, no bikeshedding).
select = ["F", "B"]
ignore = ["F841", "B007", "B904", "E501"]   # unused-local, unused-loop-var, raise-from — low value here
